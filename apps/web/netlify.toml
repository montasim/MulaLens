[build]
  command = "pnpm --filter @mulalens/web build"
  publish = "/apps/web/dist/client"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web package.json pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "20.19.3"
  PNPM_VERSION = "10.10.0"

[dev]
  command = "pnpm --filter @mulalens/web dev"
  targetPort = 3000
  port = 8888
